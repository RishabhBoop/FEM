[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "fem-project"
version = "0.2.0"
description = "FEM project"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "numba"
]

[tool.scikit-build]
wheel.packages = ["src"]
cmake.args = ["--preset", "default"]
# cmake.build-type = "Release"

[tool.black]
line-length = 120

[tool.autopep8]
max_line_length = 120
